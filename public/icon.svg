<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2d4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00dce5"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  
  <!-- Wallet -->
  <rect x="40" y="50" width="100" height="70" rx="8" fill="#2563eb"/>
  <rect x="40" y="50" width="100" height="20" rx="8" fill="#1e3a8a"/>
  <circle cx="128" cy="78" r="6" fill="url(#accent)"/>
  
  <!-- Chart bars -->
  <rect x="48" y="105" width="12" height="25" rx="3" fill="url(#accent)"/>
  <rect x="66" y="95" width="12" height="35" rx="3" fill="url(#accent)"/>
  <rect x="84" y="85" width="12" height="45" rx="3" fill="url(#accent)"/>
  
  <!-- AI badge -->
  <circle cx="130" cy="125" r="20" fill="url(#accent)"/>
  <text x="130" y="132" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0a1628" text-anchor="middle">AI</text>
</svg>
