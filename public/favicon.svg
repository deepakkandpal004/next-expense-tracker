<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2d4a"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00dce5"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Wallet body -->
  <rect x="120" y="140" width="272" height="200" rx="24" fill="url(#wallet)"/>
  
  <!-- Wallet flap -->
  <rect x="120" y="140" width="272" height="60" rx="24" fill="#1e3a8a"/>
  
  <!-- Card slot -->
  <rect x="160" y="100" width="140" height="80" rx="12" fill="url(#accent)" opacity="0.9"/>
  
  <!-- Wallet clasp -->
  <circle cx="370" cy="220" r="20" fill="url(#accent)"/>
  
  <!-- Chart bars -->
  <rect x="140" y="300" width="32" height="60" rx="6" fill="url(#accent)"/>
  <rect x="184" y="270" width="32" height="90" rx="6" fill="url(#accent)"/>
  <rect x="228" y="240" width="32" height="120" rx="6" fill="url(#accent)"/>
  
  <!-- Chart line -->
  <path d="M156 290 L200 260 L244 230 L288 200" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Chart dots -->
  <circle cx="156" cy="290" r="10" fill="white"/>
  <circle cx="200" cy="260" r="10" fill="white"/>
  <circle cx="244" cy="230" r="10" fill="white"/>
  <circle cx="288" cy="200" r="10" fill="white"/>
  
  <!-- AI badge -->
  <circle cx="360" cy="340" r="50" fill="url(#accent)"/>
  <text x="360" y="355" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#0a1628" text-anchor="middle">AI</text>
</svg>
